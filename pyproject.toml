[project]
name = "synmep"
version = "0.1.0"
description = "Kinetic model of terpenoid (squalene) production via the MEP pathway in Synechocystis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mxlpy[sundials,native]>=0.69.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# Only needed to (re)train the PETC surrogate from pfennig2024 (ADR 0002 §4).
surrogate = ["mxlmodels"]

[dependency-groups]
dev = ["ipykernel>=6.29.5", "pytest>=8.3", "ruff>=0.8", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synmep"]

[tool.uv]
exclude-newer = "3 days"
# mxlpy is developed alongside this repo: always allow the newest release (ADR 0001).
exclude-newer-package = { mxlpy = false, mxlpy-native = false, sundials4py = false }

[tool.uv.sources]
# PyPI release 1.4.0 predates the pfennig2024 rewrite (PPFD parameter, spectral data).
mxlmodels = { git = "https://github.com/Computational-Biology-Aachen/mxl-models", rev = "eb091337060469dd902b78680c8bfcb5dce3c17d" }
# 0.69.0 (unreleased): fixes MxlPy#201-#204 and shares native compiles with scan workers.
mxlpy = { git = "https://github.com/Computational-Biology-Aachen/MxlPy", rev = "3b606f090ac2ef248311630c8d8a398f26e7563d" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# verbatim legacy code (only runs in the former pixi env), kept unformatted
extend-exclude = ["scripts/legacy"]
line-length = 88
